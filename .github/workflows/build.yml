name: Release macOS (universal)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # only enable Apple signing when the certificate secret is actually set;
    # otherwise tauri tries to import an empty cert and the build fails.
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install

      # Sign + notarize only if Apple Developer secrets are configured.
      # Without these, the build stays unsigned (and succeeds).
      - name: Configure Apple signing
        if: env.HAS_SIGNING == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE<<__EOF__"
            echo "${{ secrets.APPLE_CERTIFICATE }}"
            echo "__EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Bocah Timer v__VERSION__"
          releaseBody: |
            Universal macOS build (Intel + Apple Silicon).

            **Unsigned build** — on first launch macOS shows
            "developer cannot be verified". To open:
            `xattr -dr com.apple.quarantine "/Applications/Bocah Timer.app"`
            or right-click the app → Open. See the README for details.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
